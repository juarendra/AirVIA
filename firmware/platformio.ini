[platformio]
default_envs = promicro5v

[env:promicro5v]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
lib_deps =
    nicohood/HID-Project@^2.8.4
monitor_speed = 115200
upload_protocol = avr109
build_flags =
    -D ORTHOPAD_PRODUCTION=1

[env:diagnostic]
extends = env:promicro5v
build_flags =
    -D ORTHOPAD_DIAGNOSTIC=1
